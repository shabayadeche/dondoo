name: Diagnose Odoo runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    name: Inspect Odoo routing and runtime
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect managed host without changing services
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$PRODUCTION_INSTANCE_ID"
          jq -n --rawfile inspection <(cat <<'REMOTE'
          set -euo pipefail
          echo '== Odoo process managers =='
          systemctl list-units --type=service --all --no-legend 'odoo*' || true
          command -v docker >/dev/null && docker ps --format 'docker {{.Names}} | {{.Image}} | {{.Ports}}' || true
          command -v podman >/dev/null && podman ps --format 'podman {{.Names}} | {{.Image}} | {{.Ports}}' || true
          echo '== Nginx route for odoo.kumbuo.com =='
          grep -R -n -E 'server_name[[:space:]].*odoo\.kumbuo\.com|proxy_pass' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          echo '== Listening Odoo-related processes =='
          ss -ltnp 2>/dev/null | grep -E ':(8069|807[0-9])\b' || true
          REMOTE
          ) '{commands: [$inspection]}' > ssm-parameters.json
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --comment "Diagnose Dondoo Odoo runtime" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"
          deadline=$((SECONDS + 180))
          while :; do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" --query Status --output text 2>/dev/null || printf 'Pending')"
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed)
                if (( SECONDS >= deadline )); then
                  echo "Timed out waiting for SSM command $command_id" >&2
                  exit 1
                fi
                sleep 5
                ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$status" = Success
