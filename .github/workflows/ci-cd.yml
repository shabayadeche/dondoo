name: CI and production PWA deployment

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: PWA checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace @phd-ass/pwa
      - run: npm run build:pwa

  clinical-api:
    name: Clinical API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/clinical_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/clinical_api/pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy PWA to production
    needs: [pwa, clinical-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-pwa
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      PRODUCTION_GIT_DEPLOY_KEY_SECRET_ID: ${{ vars.PRODUCTION_GIT_DEPLOY_KEY_SECRET_ID }}
      PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish immutable PWA release through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$PRODUCTION_INSTANCE_ID"
          test -n "$PRODUCTION_GIT_DEPLOY_KEY_SECRET_ID"
          cat > deploy-pwa.sh <<'REMOTE'
          #!/bin/sh
          exec bash -s <<'BASH_REMOTE'
          set -euo pipefail
          release_sha="RELEASE_SHA_PLACEHOLDER"
          aws_region="AWS_REGION_PLACEHOLDER"
          deploy_key_secret_id="GIT_DEPLOY_KEY_SECRET_ID_PLACEHOLDER"
          repository_root="/srv/phd-ass/current"
          pwa_root="/srv/phd-ass/pwa"
          release_dir="${pwa_root}/releases/${release_sha}"
          key_file=""
          aws_cli_dir=""
          staging_dir=""
          cleanup() {
            [ -z "$key_file" ] || rm -f "$key_file"
            [ -z "$aws_cli_dir" ] || rm -rf "$aws_cli_dir"
            [ -z "$staging_dir" ] || rm -rf "$staging_dir"
          }
          trap cleanup EXIT

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl git gnupg openssh-client python3 unzip
          if ! command -v aws >/dev/null; then
            aws_cli_dir="$(mktemp -d)"
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$aws_cli_dir/awscliv2.zip"
            unzip -q "$aws_cli_dir/awscliv2.zip" -d "$aws_cli_dir"
            "$aws_cli_dir/aws/install" --update
          fi
          if ! command -v node >/dev/null || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ]; then
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
            echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update -qq
            apt-get install -y -qq nodejs
          fi

          key_file="$(mktemp)"
          aws secretsmanager get-secret-value \
            --region "$aws_region" \
            --secret-id "$deploy_key_secret_id" \
            --query SecretString \
            --output text | python3 -c 'import json, sys; print(json.load(sys.stdin)["privateKey"])' > "$key_file"
          chmod 600 "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          mkdir -p "$pwa_root/releases"
          if [ ! -d "$repository_root/.git" ]; then
            if [ -e "$repository_root" ]; then
              backup_root="${repository_root}.prebootstrap.$(date -u +%Y%m%dT%H%M%SZ)"
              mv "$repository_root" "$backup_root"
            fi
            mkdir -p "$(dirname "$repository_root")"
            git clone --branch main --depth 1 git@github.com:shabayadeche/dondoo.git "$repository_root"
          fi
          cd "$repository_root"
          git remote set-url origin git@github.com:shabayadeche/dondoo.git
          git fetch --quiet origin main
          git checkout --detach --quiet "$release_sha"
          npm ci
          npm run build:pwa

          mkdir -p "${pwa_root}/releases"
          if [ ! -d "$release_dir" ]; then
            staging_dir="$(mktemp -d "${pwa_root}/releases/.${release_sha}.XXXXXX")"
            cp -a apps/pwa/dist/. "$staging_dir/"
            mv "$staging_dir" "$release_dir"
            staging_dir=""
          fi

          current_link="${pwa_root}/current"
          # A bootstrap may have created `current` as a directory. `ln -sfn`
          # would place a link *inside* that directory and leave Nginx serving
          # its stale files, so migrate it once before switching releases.
          if [ -e "$current_link" ] && [ ! -L "$current_link" ]; then
            legacy_dir="${pwa_root}/releases/legacy-current-$(date -u +%Y%m%dT%H%M%SZ)"
            mv "$current_link" "$legacy_dir"
          fi
          ln -sfn "$release_dir" "$current_link"
          test "$(readlink -f "$current_link")" = "$release_dir"
          BASH_REMOTE
          REMOTE

          sed -i "s/RELEASE_SHA_PLACEHOLDER/${GITHUB_SHA}/" deploy-pwa.sh
          sed -i "s|AWS_REGION_PLACEHOLDER|${AWS_REGION}|" deploy-pwa.sh
          sed -i "s|GIT_DEPLOY_KEY_SECRET_ID_PLACEHOLDER|${PRODUCTION_GIT_DEPLOY_KEY_SECRET_ID}|" deploy-pwa.sh
          jq -n --rawfile deployment deploy-pwa.sh '{commands: [$deployment]}' > ssm-parameters.json
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --comment "Deploy Dondoo PWA ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID"
          wait_status=$?
          set -e
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$PRODUCTION_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$wait_status" -eq 0
          test "$status" = Success

      - name: Smoke test public health endpoint
        if: env.PRODUCTION_SMOKE_URL != ''
        shell: bash
        run: curl --fail --retry 5 --retry-all-errors --max-time 15 "$PRODUCTION_SMOKE_URL"
